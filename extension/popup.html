<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>TubeScout</title>
  <link rel="stylesheet" href="ui.css">
  <style>
    body { width: 320px; padding: 14px; }
    h1 { font-size: 16px; margin: 0; }
    .server { margin-top: 10px; font-size: 12.5px; word-break: break-all; }
    .row { margin-top: 12px; }
    .row button { flex: 1; white-space: nowrap; padding: 8px 10px; }
  </style>
</head>
<body>
  <div class="brand"><span class="logo" aria-hidden="true">TS</span><h1>TubeScout</h1></div>
  <div class="server muted">Server: <span id="server"></span></div>
  <div id="status" class="status" aria-live="polite"></div>
  <div class="row">
    <button class="primary" type="button" id="open">Open dashboard</button>
    <button class="ghost" type="button" id="options">Settings</button>
  </div>
  <p class="hint">Open a YouTube video, channel or search page to see the TubeScout panel.</p>
  <script src="lib.js"></script>
  <script src="status.js"></script>
  <script src="popup.js"></script>
</body>
</html>
